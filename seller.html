<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MicroERP - Vista Vendedor">
  <title>MicroERP - Vendedor</title>
  <script src="js/microerp.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#176B45', 'primary-hover': '#125737', 'primary-soft': '#EAF5ED', surface: '#F6F8F7' } } } };
  </script>
</head>
<body class="min-h-screen bg-surface text-[#202522] antialiased dark:bg-gray-950 dark:text-gray-100">
  <header class="border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="mx-auto flex h-[72px] max-w-[1440px] items-center justify-between px-5 sm:px-8 lg:px-12">
      <a href="index.html" class="flex items-center gap-2.5"><span class="grid h-9 w-9 place-items-center rounded-lg bg-primary font-black text-white">M</span><span class="text-xl font-extrabold">MicroERP</span></a>
      <div class="flex items-center gap-3">
        <span class="hidden text-sm text-gray-500 sm:inline dark:text-gray-400">Usuario: <strong class="text-gray-800 dark:text-gray-100">Vendedor</strong></span>
        <button id="theme-toggle" type="button" class="grid h-9 w-9 place-items-center rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-800"></button>
        <a href="index.html" class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-semibold dark:border-gray-700">Salir</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-5 py-8 sm:px-8 lg:px-12">
    <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900 sm:p-6">
      <h1 class="text-xl font-extrabold">Búsqueda Rápida</h1>
      <div class="mt-5 grid gap-4 md:grid-cols-2 xl:grid-cols-[1fr_1.2fr_.9fr_.9fr_auto] xl:items-end">
        <label class="block">
          <span class="mb-2 block text-sm font-bold">Código de Barra</span>
          <input id="barcode" type="search" placeholder="Escanear o escribir..." class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm dark:border-gray-700 dark:bg-gray-800">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-bold">Nombre Genérico / Marca</span>
          <input id="product-name" type="search" placeholder="Escribir producto..." class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm dark:border-gray-700 dark:bg-gray-800">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-bold">Categoría</span>
          <select id="category" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm dark:border-gray-700 dark:bg-gray-800">
            <option value="">Seleccionar...</option>
            <option>Electrónica</option>
            <option>Ropa y Accesorios</option>
            <option>Alimentos</option>
            <option>Accesorios</option>
            <option>Mobiliario</option>
          </select>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-bold">Ubicación</span>
          <select id="location" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm dark:border-gray-700 dark:bg-gray-800">
            <option value="">Todas las ubicaciones</option>
            <option>Mostrador</option>
            <option>Estante</option>
            <option>Vitrina</option>
          </select>
        </label>
        <button id="search-button" type="button" class="rounded-lg bg-primary px-6 py-2.5 text-sm font-bold text-white transition hover:bg-primary-hover">Buscar</button>
      </div>
    </section>

    <section class="mt-6 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4 dark:border-gray-800">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.18em] text-primary">Inventario</p>
          <h2 class="mt-1 text-xl font-extrabold">Control de Inventario</h2>
        </div>
        <span id="result-count" class="text-sm text-gray-500">0 registros</span>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-[980px] w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase tracking-wide text-gray-500 dark:bg-gray-800/70 dark:text-gray-400">
            <tr>
              <th class="px-5 py-3">Código</th>
              <th class="px-5 py-3">Producto</th>
              <th class="px-5 py-3">Stock</th>
              <th class="px-5 py-3">Valor</th>
              <th class="px-5 py-3">Categoría</th>
              <th class="px-5 py-3">Zona</th>
              <th class="px-5 py-3">Ubicación</th>
            </tr>
          </thead>
          <tbody id="inventory-body" class="divide-y divide-gray-100 dark:divide-gray-800"></tbody>
        </table>
      </div>

      <div id="empty-state" class="border-t border-gray-100 px-6 py-14 text-center dark:border-gray-800">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-primary-soft text-xl dark:bg-green-950/40">⌕</div>
        <h3 class="mt-4 font-extrabold">No hay productos registrados</h3>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">El inventario aparecerá aquí cuando el administrador registre productos.</p>
      </div>
    </section>
  </main>

  <script>
    const barcode = document.getElementById('barcode');
    const productName = document.getElementById('product-name');
    const category = document.getElementById('category');
    const locationFilter = document.getElementById('location');
    const tbody = document.getElementById('inventory-body');
    const empty = document.getElementById('empty-state');
    const count = document.getElementById('result-count');

    function render() {
      const products = MicroERP.getProducts();
      const codeQuery = barcode.value.trim().toLowerCase();
      const nameQuery = productName.value.trim().toLowerCase();
      const selectedCategory = category.value;
      const selectedLocation = locationFilter.value;

      const filtered = products.filter(product => {
        const code = String(product.code || '').toLowerCase();
        const nameAndBrand = `${product.name || ''} ${product.brand || ''}`.toLowerCase();
        return (!codeQuery || code.includes(codeQuery)) &&
          (!nameQuery || nameAndBrand.includes(nameQuery)) &&
          (!selectedCategory || product.category === selectedCategory) &&
          (!selectedLocation || product.zone === selectedLocation);
      });

      count.textContent = `${filtered.length} registro${filtered.length === 1 ? '' : 's'}`;
      empty.classList.toggle('hidden', filtered.length > 0);
      tbody.innerHTML = filtered.map(product => `
        <tr>
          <td class="px-5 py-4 font-mono text-xs">${product.code || ''}</td>
          <td class="px-5 py-4 font-bold">${product.name || ''}</td>
          <td class="px-5 py-4">${Number(product.stock || 0)} uds</td>
          <td class="px-5 py-4 font-semibold text-primary dark:text-green-400">${MicroERP.money(product.price)}</td>
          <td class="px-5 py-4">${product.category || ''}</td>
          <td class="px-5 py-4">${product.zone || ''}</td>
          <td class="px-5 py-4">${product.location || ''}</td>
        </tr>`).join('');
    }

    document.getElementById('search-button').addEventListener('click', render);
    [barcode, productName, category, locationFilter].forEach(control => control.addEventListener('input', render));
    render();
  </script>
</body>
</html>
